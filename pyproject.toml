[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githood"
version = "0.1.0"
description = "One spec in, one repo out — a generator for trading-bot repositories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["scaffold", "generator", "cli", "trading", "git"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]
dependencies = []

[project.scripts]
githood = "githood.cli:main"

[tool.setuptools]
packages = ["githood"]
