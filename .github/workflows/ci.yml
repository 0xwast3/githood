name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -q
      - name: scaffold a repo and run its tests
        run: |
          python -m githood new examples/momentum.spec.md -o /tmp/demo --no-git
          cd /tmp/demo && python -m unittest discover -s tests -q
